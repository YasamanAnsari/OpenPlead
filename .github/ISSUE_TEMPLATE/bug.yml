name: Bug report
description: Something the pet did, or did not do
labels: [bug]
body:
  - type: input
    id: platform
    attributes:
      label: Platform and agent
      placeholder: macOS 26 · Claude Code 2.1 inside Cursor
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `openplead doctor` and the last lines of `~/.openplead/openplead.log`
      render: text
  - type: dropdown
    id: launch
    attributes:
      label: How was the pet started?
      options: [By a hook when a session started, By hand (openplead start / npm start), Not sure]

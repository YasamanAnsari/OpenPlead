<svg xmlns="http://www.w3.org/2000/svg" width="160" height="130" viewBox="0 0 160 130">
  <!-- Sleeping: standing with the arms dropped low, shut 'v' eyes (pack 'sleeping-soundly'), slow breathing, a snore bubble that grows and pops, purple z's drifting up, moon and twinkling stars. 4 s loop. Geometry from grovel-base.svg. -->
  <style>
    .pet { animation: breathe 4s ease-in-out infinite; transform-origin: 80px 76px; }
    .z { animation: drift 4s linear infinite; } .z2 { animation-delay: -1.33s; } .z3 { animation-delay: -2.67s; }
    .bub { animation: bubble 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
    .pop { animation: wPop 4s linear infinite; }
    .star { animation: twinkle 2s steps(1, end) infinite; } .s2 { animation-delay: -1s; }
    @keyframes bubble { 0.000% { transform: scale(0.25); opacity: 1 } 85.000% { transform: scale(1); opacity: 1 } 85.025% { transform: scale(1); opacity: 0 } 99.975% { transform: scale(0.25); opacity: 0 } 100.000% { transform: scale(0.25); opacity: 1 } }
    @keyframes wPop { 0.000% { opacity: 0 } 84.975% { opacity: 0 } 85.000% { opacity: 1 } 91.225% { opacity: 1 } 91.250% { opacity: 0 } 100.000% { opacity: 0 } }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }
    @keyframes drift { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(8px, -16px) scale(1); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
  <g transform="translate(0 20)">
    <ellipse cx="80" cy="104" rx="56" ry="4" fill="#000" opacity="0.15"/>
    <g shape-rendering="crispEdges"><g fill="#ffe05c"><rect x="16" y="-8" width="4" height="4"/><rect x="20" y="-8" width="4" height="4"/><rect x="12" y="-4" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><rect x="16" y="12" width="4" height="4"/><rect x="20" y="12" width="4" height="4"/><rect x="24" y="-6" width="4" height="4"/><rect x="24" y="10" width="4" height="4"/></g></g>
    <g shape-rendering="crispEdges"><g class="star"><g fill="#ffe05c"><rect x="34" y="2" width="2" height="6"/><rect x="32" y="4" width="6" height="2"/></g></g><g class="star s2"><g fill="#ffe05c"><rect x="150" y="28" width="2" height="6"/><rect x="148" y="30" width="6" height="2"/></g></g></g>
    <g shape-rendering="crispEdges">
      <g class="z"><g transform="translate(132 4)"><g fill="#5b1fdd"><rect x="0" y="0" width="4" height="4"/><rect x="4" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/><rect x="6" y="4" width="4" height="4"/><rect x="3" y="8" width="4" height="4"/><rect x="0" y="12" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/></g></g></g>
      <g class="z z2"><g transform="translate(132 4)"><g fill="#5b1fdd"><rect x="0" y="0" width="4" height="4"/><rect x="4" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/><rect x="6" y="4" width="4" height="4"/><rect x="3" y="8" width="4" height="4"/><rect x="0" y="12" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/></g></g></g>
      <g class="z z3"><g transform="translate(132 4)"><g fill="#5b1fdd"><rect x="0" y="0" width="4" height="4"/><rect x="4" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/><rect x="6" y="4" width="4" height="4"/><rect x="3" y="8" width="4" height="4"/><rect x="0" y="12" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/></g></g></g>
    </g>
    <g class="pet" shape-rendering="crispEdges" fill="#D97757">
      <g><rect data-part="leg" x="42" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="63" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="86" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="107" y="76" width="11" height="26"/></g>
      <rect data-part="body" x="32" y="16" width="96" height="60"/>
      <g class=""><rect data-part="arm" x="12" y="56" width="20" height="20"/></g><g class=""><rect data-part="arm" x="128" y="56" width="20" height="20"/></g>
      <g fill="#2f2f38"><rect x="44" y="28" width="4" height="5"/><rect x="51" y="28" width="4" height="5"/><rect x="47" y="33" width="5" height="5"/><rect x="105" y="28" width="4" height="5"/><rect x="112" y="28" width="4" height="5"/><rect x="108" y="33" width="5" height="5"/></g>
      <rect x="76" y="46" width="8" height="4" fill="#FFFFFF"/>
      <g class="bub"><g transform="translate(118 30)"><g fill="#83d0ff"><rect x="4" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="12" y="8" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/></g><rect x="4" y="4" width="8" height="8" fill="#83d0ff"/><rect x="4" y="4" width="4" height="4" fill="#FFFFFF"/></g></g>
      <g class="pop"><g fill="#83d0ff"><rect x="114" y="26" width="3" height="3"/><rect x="136" y="24" width="3" height="3"/><rect x="138" y="46" width="3" height="3"/><rect x="112" y="46" width="3" height="3"/></g></g>
    </g>
  </g>
</svg>

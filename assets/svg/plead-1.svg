<svg xmlns="http://www.w3.org/2000/svg" width="160" height="130" viewBox="0 0 160 130">
  <!-- Plead 1: both arms travel in from the sides and clasp (0-0.4 s), hold with a tremble while the eyes look up at you (1.0-2.4 s), blink, then the arms go back out (2.6-3 s). Raised pixel brows, white frown, a sweat drop, a shine on the clasped hands. 3 s loop. Geometry from grovel-base.svg. -->
  <style>
    .pet { animation: sway 3s ease-in-out infinite; }
    .arm-l { animation: armL 3s ease-in-out infinite; }
    .arm-r { animation: armR 3s ease-in-out infinite; }
    .eyes { animation: look 3s ease-in-out infinite; }
    .lids { animation: wLids 3s linear infinite; }
    .sweat { animation: sweat 3s linear infinite; }
    .shine { animation: wShine 3s linear infinite; } .tw { animation: blink 0.5s steps(1, end) infinite; }
    @keyframes armL { 0.000% { transform: translate(0px, 0px) } 13.333% { transform: translate(48px, 12px) } 18.333% { transform: translate(48px, 11px) } 23.333% { transform: translate(48px, 12px) } 28.333% { transform: translate(48px, 11px) } 33.333% { transform: translate(48px, 12px) } 38.333% { transform: translate(48px, 11px) } 43.333% { transform: translate(48px, 12px) } 48.333% { transform: translate(48px, 11px) } 53.333% { transform: translate(48px, 12px) } 58.333% { transform: translate(48px, 11px) } 63.333% { transform: translate(48px, 12px) } 68.333% { transform: translate(48px, 11px) } 73.333% { transform: translate(48px, 12px) } 78.333% { transform: translate(48px, 11px) } 83.333% { transform: translate(48px, 12px) } 86.667% { transform: translate(48px, 12px) } 100.000% { transform: translate(0px, 0px) } }
    @keyframes armR { 0.000% { transform: translate(0px, 0px) } 13.333% { transform: translate(-52px, 16px) } 18.333% { transform: translate(-52px, 15px) } 23.333% { transform: translate(-52px, 16px) } 28.333% { transform: translate(-52px, 15px) } 33.333% { transform: translate(-52px, 16px) } 38.333% { transform: translate(-52px, 15px) } 43.333% { transform: translate(-52px, 16px) } 48.333% { transform: translate(-52px, 15px) } 53.333% { transform: translate(-52px, 16px) } 58.333% { transform: translate(-52px, 15px) } 63.333% { transform: translate(-52px, 16px) } 68.333% { transform: translate(-52px, 15px) } 73.333% { transform: translate(-52px, 16px) } 78.333% { transform: translate(-52px, 15px) } 83.333% { transform: translate(-52px, 16px) } 86.667% { transform: translate(-52px, 16px) } 100.000% { transform: translate(0px, 0px) } }
    @keyframes look { 0.000% { transform: translate(0px, 0px) } 33.333% { transform: translate(0px, 0px) } 43.333% { transform: translate(0px, -3px) } 70.000% { transform: translate(0px, -3px) } 80.000% { transform: translate(0px, 0px) } 100.000% { transform: translate(0px, 0px) } }
    @keyframes wLids { 0.000% { opacity: 0 } 84.967% { opacity: 0 } 85.000% { opacity: 1 } 89.967% { opacity: 1 } 90.000% { opacity: 0 } 100.000% { opacity: 0 } }
    @keyframes wShine { 0.000% { opacity: 0 } 19.967% { opacity: 0 } 20.000% { opacity: 1 } 83.300% { opacity: 1 } 83.333% { opacity: 0 } 100.000% { opacity: 0 } }
    @keyframes sweat { 0.000% { transform: translateY(0); opacity: 0 } 40.000% { transform: translateY(0); opacity: 0 } 43.333% { opacity: 1 } 73.333% { transform: translateY(10px); opacity: 1 } 76.667% { transform: translateY(10px); opacity: 0 } 100.000% { transform: translateY(10px); opacity: 0 } }
    @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <g transform="translate(0 20)">
    <ellipse cx="80" cy="104" rx="56" ry="4" fill="#000" opacity="0.15"/>
    <g class="pet" shape-rendering="crispEdges" fill="#D97757">
      <g><rect data-part="leg" x="42" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="63" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="86" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="107" y="76" width="11" height="26"/></g>
      <rect data-part="body" x="32" y="16" width="96" height="60"/>
      <g fill="#2f2f38"><rect x="42" y="22" width="4" height="4"/><rect x="46" y="19" width="4" height="4"/><rect x="50" y="16" width="4" height="4"/><rect x="114" y="22" width="4" height="4"/><rect x="110" y="19" width="4" height="4"/><rect x="106" y="16" width="4" height="4"/></g>
      <g class="eyes"><g fill="#2f2f38"><rect x="44" y="28" width="11" height="10"/><rect x="105" y="28" width="11" height="10"/></g><rect x="45" y="29" width="3" height="3" fill="#FFFFFF"/><rect x="106" y="29" width="3" height="3" fill="#FFFFFF"/></g>
      <g class="lids"><rect x="43" y="27" width="13" height="12"/><rect x="104" y="27" width="13" height="12"/><g fill="#2f2f38"><rect x="44" y="32" width="11" height="3"/><rect x="105" y="32" width="11" height="3"/></g></g>
      <g fill="#FFFFFF"><rect x="76" y="44" width="4" height="4"/><rect x="80" y="44" width="4" height="4"/><rect x="72" y="48" width="4" height="4"/><rect x="84" y="48" width="4" height="4"/></g>
      <g class="sweat" fill="#3eadff"><rect x="122" y="20" width="4" height="4"/></g>
      <g class="arm-l"><rect data-part="arm" x="12" y="36" width="20" height="20" stroke="#B5603F" stroke-width="2"/></g><g class="arm-r"><rect data-part="arm" x="128" y="36" width="20" height="20" stroke="#B5603F" stroke-width="2"/></g>
      <g class="shine"><g class="tw"><g fill="#ffff39"><rect x="58" y="44" width="2" height="6"/><rect x="56" y="46" width="6" height="2"/></g><g fill="#ffff39"><rect x="100" y="74" width="2" height="6"/><rect x="98" y="76" width="6" height="2"/></g></g></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="160" height="130" viewBox="0 0 160 130">
  <!-- Joy-cry: it works! Happy '^' eyes, white smile, blush, tears of joy, both arms thrown up above the head and cheering, hopping with dust on each landing, twinkling stars and falling pixel confetti. 2 s loop. Geometry from grovel-base.svg. -->
  <style>
    .pet { animation: hop 0.5s ease-out infinite; }
    .arm-l { animation: cheer 0.5s ease-in-out infinite; } .arm-r { animation: cheer 0.5s ease-in-out -0.25s infinite; }
    .tear { animation: fall 0.5s linear infinite; } .t2 { animation-delay: -0.25s; }
    .star { animation: twinkle 1s steps(1, end) infinite; } .s2 { animation-delay: -0.33s; } .s3 { animation-delay: -0.66s; }
    .conf { animation: confetti 2s linear infinite; } .c2 { animation-delay: -0.5s; } .c3 { animation-delay: -1s; } .c4 { animation-delay: -1.5s; }
    .land { animation: wLand 2s linear infinite; }
    @keyframes wLand { 0.000% { opacity: 1 } 5.950% { opacity: 1 } 6.000% { opacity: 0 } 24.950% { opacity: 0 } 25.000% { opacity: 1 } 30.950% { opacity: 1 } 31.000% { opacity: 0 } 49.950% { opacity: 0 } 50.000% { opacity: 1 } 55.950% { opacity: 1 } 56.000% { opacity: 0 } 74.950% { opacity: 0 } 75.000% { opacity: 1 } 80.950% { opacity: 1 } 81.000% { opacity: 0 } 100.000% { opacity: 0 } }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    @keyframes cheer { 0%, 100% { transform: translateY(-40px); } 50% { transform: translateY(-46px); } }
    @keyframes fall { 0% { transform: translateY(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(30px); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes confetti { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(96px); opacity: 0; } }
  </style>
  <g transform="translate(0 20)">
    <ellipse cx="80" cy="104" rx="56" ry="4" fill="#000" opacity="0.15"/>
    <g shape-rendering="crispEdges"><g class="conf "><g fill="#f4552a"><rect x="20" y="-17" width="3" height="9"/><rect x="17" y="-14" width="9" height="3"/></g></g><g class="conf c2"><g fill="#50ffb4"><rect x="60" y="-17" width="3" height="9"/><rect x="57" y="-14" width="9" height="3"/></g></g><g class="conf c3"><g fill="#ffff39"><rect x="100" y="-17" width="3" height="9"/><rect x="97" y="-14" width="9" height="3"/></g></g><g class="conf c4"><g fill="#1fa028"><rect x="140" y="-17" width="3" height="9"/><rect x="137" y="-14" width="9" height="3"/></g></g><g class="conf c3"><g fill="#873be0"><rect x="6" y="-17" width="3" height="9"/><rect x="3" y="-14" width="9" height="3"/></g></g><g class="conf c2"><g fill="#aa399f"><rect x="150" y="-17" width="3" height="9"/><rect x="147" y="-14" width="9" height="3"/></g></g></g>
    <g shape-rendering="crispEdges"><g class="star"><g fill="#ffff39"><rect x="8" y="-4" width="4" height="12"/><rect x="4" y="0" width="12" height="4"/></g><rect x="8" y="0" width="4" height="4" fill="#FFFFFF"/><g fill="#50ffb4"><rect x="144" y="37" width="3" height="9"/><rect x="141" y="40" width="9" height="3"/></g><rect x="144" y="40" width="3" height="3" fill="#FFFFFF"/></g><g class="star s2"><g fill="#ffff39"><rect x="150" y="-12" width="4" height="12"/><rect x="146" y="-8" width="12" height="4"/></g><rect x="150" y="-8" width="4" height="4" fill="#FFFFFF"/><g fill="#aa399f"><rect x="8" y="61" width="3" height="9"/><rect x="5" y="64" width="9" height="3"/></g><rect x="8" y="64" width="3" height="3" fill="#FFFFFF"/></g>
      <g class="star s3"><g fill="#ffff39"><rect x="80" y="-20" width="4" height="12"/><rect x="76" y="-16" width="12" height="4"/></g><rect x="80" y="-16" width="4" height="4" fill="#FFFFFF"/><g fill="#873be0"><rect x="152" y="69" width="3" height="9"/><rect x="149" y="72" width="9" height="3"/></g><rect x="152" y="72" width="3" height="3" fill="#FFFFFF"/></g></g>
    <g class="land" shape-rendering="crispEdges"><g fill="#D0D4DA"><rect x="24" y="98" width="4" height="4"/><rect x="28" y="98" width="4" height="4"/><rect x="32" y="98" width="4" height="4"/><rect x="28" y="94" width="4" height="4"/></g><g fill="#D0D4DA"><rect x="124" y="98" width="4" height="4"/><rect x="128" y="98" width="4" height="4"/><rect x="132" y="98" width="4" height="4"/><rect x="128" y="94" width="4" height="4"/></g></g>
    <g class="pet" shape-rendering="crispEdges" fill="#D97757">
      <g><rect data-part="leg" x="42" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="63" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="86" y="76" width="11" height="26"/></g><g><rect data-part="leg" x="107" y="76" width="11" height="26"/></g>
      <rect data-part="body" x="32" y="16" width="96" height="60"/>
      <g class="arm-l"><rect data-part="arm" x="12" y="36" width="20" height="20"/></g><g class="arm-r"><rect data-part="arm" x="128" y="36" width="20" height="20"/></g>
      <g fill="#2f2f38"><rect x="47" y="28" width="5" height="5"/><rect x="44" y="33" width="4" height="5"/><rect x="51" y="33" width="4" height="5"/><rect x="108" y="28" width="5" height="5"/><rect x="105" y="33" width="4" height="5"/><rect x="112" y="33" width="4" height="5"/></g>
      <g fill="#F48FB1"><rect x="36" y="42" width="4" height="4"/><rect x="40" y="42" width="4" height="4"/><rect x="116" y="42" width="4" height="4"/><rect x="120" y="42" width="4" height="4"/></g>
      <g fill="#FFFFFF"><rect x="72" y="44" width="4" height="4"/><rect x="84" y="44" width="4" height="4"/><rect x="76" y="48" width="4" height="4"/><rect x="80" y="48" width="4" height="4"/></g>
      <g class="tear" fill="#3eadff"><rect x="40" y="36" width="4" height="4"/></g><g class="tear t2" fill="#3eadff"><rect x="40" y="36" width="4" height="4"/></g><g class="tear t2" fill="#3eadff"><rect x="116" y="36" width="4" height="4"/></g><g class="tear" fill="#3eadff"><rect x="116" y="36" width="4" height="4"/></g>
    </g>
  </g>
</svg>

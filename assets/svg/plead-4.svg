<svg xmlns="http://www.w3.org/2000/svg" width="160" height="130" viewBox="0 0 160 130">
  <!-- Plead 4: kneeling and crying. Shut 'v' eyes, tears spurting from the eyes and running down the cheeks, a gloom cloud dripping over its head, wobbling frown, shivering; hands clasped low. 2 s loop. Geometry from grovel-base.svg. -->
  <style>
    .upper { animation: shiver 0.2s steps(2, end) infinite; }
    .spA { animation: tog 0.4s steps(1, end) infinite; } .spB { animation: tog 0.4s steps(1, end) -0.2s infinite; }
    .poolHi { animation: tog 0.5s steps(1, end) infinite; }
    .pool { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .cloud { animation: driftX 2s ease-in-out infinite; }
    .rain { animation: rain 1s linear infinite; } .r2 { animation-delay: -0.5s; }
    .mA { animation: tog 0.4s steps(1, end) infinite; } .mB { animation: tog 0.4s steps(1, end) -0.2s infinite; }
    @keyframes shiver { 0%, 100% { transform: translateX(-1px); } 50% { transform: translateX(1px); } }
    @keyframes tog { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.04); } }
    @keyframes driftX { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
    @keyframes rain { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
  </style>
  <g transform="translate(0 20)">
    <ellipse cx="80" cy="104" rx="58" ry="4" fill="#000" opacity="0.15"/>
    <g shape-rendering="crispEdges" fill="#D97757">
      <g data-part="leg"><rect x="50" y="91" width="13" height="11" fill="#C4694B"/><rect x="63" y="89" width="11" height="13"/></g><g data-part="leg"><rect x="97" y="91" width="13" height="11" fill="#C4694B"/><rect x="86" y="89" width="11" height="13"/></g><g data-part="leg"><rect x="29" y="91" width="13" height="11" fill="#C4694B"/><rect x="42" y="89" width="11" height="13"/></g><g data-part="leg"><rect x="118" y="91" width="13" height="11" fill="#C4694B"/><rect x="107" y="89" width="11" height="13"/></g>
      <g transform="translate(0 13)"><g class="upper">
        <rect data-part="body" x="32" y="16" width="96" height="60"/>
        <g class="cloud"><g fill="#D0D4DA"><rect x="66" y="-10" width="4" height="4"/><rect x="70" y="-10" width="4" height="4"/><rect x="74" y="-10" width="4" height="4"/><rect x="78" y="-14" width="4" height="4"/><rect x="82" y="-14" width="4" height="4"/><rect x="86" y="-10" width="4" height="4"/><rect x="90" y="-10" width="4" height="4"/><rect x="62" y="-6" width="4" height="4"/><rect x="94" y="-6" width="4" height="4"/></g><rect x="62" y="-6" width="36" height="8" fill="#D0D4DA"/><g fill="#3eadff"><rect class="rain" x="70" y="3" width="3" height="4"/><rect class="rain r2" x="88" y="3" width="3" height="4"/></g></g>
        <g fill="#2f2f38"><rect x="42" y="22" width="4" height="4"/><rect x="46" y="19" width="4" height="4"/><rect x="50" y="16" width="4" height="4"/><rect x="114" y="22" width="4" height="4"/><rect x="110" y="19" width="4" height="4"/><rect x="106" y="16" width="4" height="4"/></g>
        <g fill="#2f2f38"><rect x="44" y="28" width="4" height="5"/><rect x="51" y="28" width="4" height="5"/><rect x="47" y="33" width="5" height="5"/><rect x="105" y="28" width="4" height="5"/><rect x="112" y="28" width="4" height="5"/><rect x="108" y="33" width="5" height="5"/></g>
        <g class="mA"><g fill="#FFFFFF"><rect x="76" y="44" width="4" height="4"/><rect x="80" y="44" width="4" height="4"/><rect x="72" y="48" width="4" height="4"/><rect x="84" y="48" width="4" height="4"/></g></g><g class="mB"><rect x="76" y="46" width="8" height="4" fill="#FFFFFF"/></g>
        <g class="spA" fill="#3eadff"><rect x="39" y="30" width="7" height="7"/><rect x="32" y="23" width="7" height="7"/><rect x="46" y="16" width="7" height="7"/><rect x="39" y="9" width="7" height="7"/><rect x="39" y="44" width="7" height="7"/><rect x="114" y="30" width="7" height="7"/><rect x="121" y="23" width="7" height="7"/><rect x="107" y="16" width="7" height="7"/><rect x="114" y="9" width="7" height="7"/><rect x="114" y="44" width="7" height="7"/></g><g class="spB" fill="#3eadff"><rect x="39" y="51" width="7" height="7"/><rect x="39" y="58" width="7" height="7"/><rect x="32" y="65" width="7" height="7"/><rect x="114" y="51" width="7" height="7"/><rect x="114" y="58" width="7" height="7"/><rect x="121" y="65" width="7" height="7"/></g><g class="poolHi" fill="#83d0ff"><rect x="39" y="65" width="7" height="7"/><rect x="32" y="72" width="7" height="7"/><rect x="114" y="65" width="7" height="7"/><rect x="121" y="72" width="7" height="7"/></g>
        <g class="arms"><g class=""><rect data-part="arm" x="60" y="52" width="20" height="20" stroke="#B5603F" stroke-width="2"/></g><g class=""><rect data-part="arm" x="76" y="56" width="20" height="20" stroke="#B5603F" stroke-width="2"/></g></g>
      </g></g>
    </g>
  </g>
</svg>
